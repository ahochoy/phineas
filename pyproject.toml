[project]
name = "phineas"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.107",
    "botocore[crt]>=1.43.107",
    "fastapi>=0.162.2",
    "pydantic>=2.13.5",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
include = [
    "src",
    "tests",
]
pythonVersion = "3.14"
typeCheckingMode = "standard"
